<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"product-name","type":"string","label":"Product name","default":"FuelTrack"},
    {"id":"tagline","type":"string","label":"Tagline","default":"Private fuel computer for every vehicle you drive"},
    {"id":"outro-line","type":"string","label":"Outro line","default":"Multi-vehicle fill-ups, dual currency, UK-ready — all on your iPhone."},
    {"id":"product-icon","type":"string","label":"App icon","default":"assets/app-icon.png"},
    {"id":"color-ground","type":"color","label":"Background","default":"#0D1A2E"},
    {"id":"color-accent","type":"color","label":"Teal accent","default":"#388EAB"},
    {"id":"color-warm","type":"color","label":"Cost accent","default":"#EB8538"},
    {"id":"font-display","type":"string","label":"Display font","default":"Outfit"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0d1a2e;
        --color-accent: #388eab;
        --color-warm: #eb8538;
        --font-display: Outfit, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        class="clip"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="2.8"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="phone-tour"
        class="clip"
        data-composition-id="phone-tour"
        data-composition-src="compositions/phone-tour.html"
        data-start="2.8"
        data-duration="16.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="outro"
        class="clip"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="19.3"
        data-duration="2.7"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Music bed -->
      <audio
        id="bgm"
        class="clip"
        src="assets/audio/bgm.mp3"
        data-start="0"
        data-duration="22"
        data-track-index="1"
        data-volume="0.3"
        data-fade-in="1.2"
        data-fade-out="1.6"
      ></audio>

      <!-- Transition / accent SFX -->
      <audio
        id="sfx-intro"
        class="clip"
        src="assets/audio/sparkle.mp3"
        data-start="0.2"
        data-duration="1.8"
        data-track-index="2"
        data-volume="0.45"
        data-fade-out="0.3"
      ></audio>
      <audio
        id="sfx-tour-home"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="3.05"
        data-duration="0.57"
        data-track-index="2"
        data-volume="0.55"
      ></audio>
      <audio
        id="sfx-tour-fillup"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="5.85"
        data-duration="0.57"
        data-track-index="2"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-tour-fuel"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="8.6"
        data-duration="0.57"
        data-track-index="2"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-tour-spend"
        class="clip"
        src="assets/audio/click-soft.mp3"
        data-start="11.35"
        data-duration="0.37"
        data-track-index="2"
        data-volume="0.65"
      ></audio>
      <audio
        id="sfx-tour-stations"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="13.9"
        data-duration="0.57"
        data-track-index="2"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-tour-more"
        class="clip"
        src="assets/audio/whoosh-short.mp3"
        data-start="16.55"
        data-duration="0.57"
        data-track-index="2"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-outro"
        class="clip"
        src="assets/audio/chime.mp3"
        data-start="19.4"
        data-duration="2.5"
        data-track-index="2"
        data-volume="0.4"
        data-fade-out="0.4"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
