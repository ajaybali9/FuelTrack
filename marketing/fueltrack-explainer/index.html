<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"product-name","type":"string","label":"Product name","default":"FuelTrack"},
    {"id":"tagline","type":"string","label":"Tagline","default":"Private fuel computer for every vehicle you drive"},
    {"id":"metrics-headline","type":"string","label":"Metrics headline","default":"Numbers you can trust"},
    {"id":"metric-l100","type":"string","label":"L/100km","default":"6.4"},
    {"id":"metric-mpg","type":"string","label":"UK MPG","default":"44.1"},
    {"id":"metric-cost","type":"string","label":"Cost p/mi","default":"14.2"},
    {"id":"outro-line","type":"string","label":"Outro line","default":"Multi-vehicle fill-ups, dual currency, UK-ready — all on your iPhone."},
    {"id":"product-icon","type":"string","label":"App icon","default":"assets/app-icon.png"},
    {"id":"color-ground","type":"color","label":"Background","default":"#0D1A2E"},
    {"id":"color-accent","type":"color","label":"Teal accent","default":"#388EAB"},
    {"id":"color-warm","type":"color","label":"Cost accent","default":"#EB8538"},
    {"id":"font-display","type":"string","label":"Display font","default":"Outfit"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0d1a2e;
        --color-accent: #388eab;
        --color-warm: #eb8538;
        --font-display: Outfit, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        class="clip"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="phone-tour"
        class="clip"
        data-composition-id="phone-tour"
        data-composition-src="compositions/phone-tour.html"
        data-start="3"
        data-duration="14"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="outro"
        class="clip"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="17"
        data-duration="3.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
