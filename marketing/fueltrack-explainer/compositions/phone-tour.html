  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#phone",
      { opacity: 0, y: 40, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
      0.1,
    );
    tl.fromTo(
      "#tour-kicker",
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
      0.2,
    );

    // Beat times
    const beats = [
      { callout: "#callout-home", screen: "#screen-home", tab: "#tab-home", start: 0.35, hold: 3.0 },
      { callout: "#callout-fillup", screen: "#screen-fillup", tab: "#tab-fuel", start: 3.5, hold: 3.2 },
      { callout: "#callout-vehicles", screen: "#screen-vehicles", tab: "#tab-more", start: 6.9, hold: 3.2 },
      { callout: "#callout-spend", screen: "#screen-spend", tab: "#tab-spend", start: 10.3, hold: 3.4 },
    ];

    const tabMeta = {
      "#tab-home": { color: "#b6e3f0", dot: "#388eab" },
      "#tab-fuel": { color: "#b6e3f0", dot: "#388eab" },
      "#tab-spend": { color: "#f6c59a", dot: "#eb8538" },
      "#tab-stations": { color: "#b6e3f0", dot: "#388eab" },
      "#tab-more": { color: "#b6e3f0", dot: "#388eab" },
    };
    const allTabs = Object.keys(tabMeta);

    function setActiveTab(active, at) {
      allTabs.forEach((t) => {
        const on = t === active;
        const meta = tabMeta[t];
        tl.to(
          t,
          {
            color: on ? meta.color : "#a8b0ba",
            duration: 0.2,
            ease: "power1.out",
          },
          at,
        );
        tl.to(
          `${t} .dot`,
          {
            backgroundColor: on ? meta.dot : "rgba(238,245,248,0.22)",
            duration: 0.2,
            ease: "power1.out",
          },
          at,
        );
      });
    }

    beats.forEach((b, i) => {
      const fade = 0.35;
      const end = b.start + b.hold;
      tl.fromTo(
        b.callout,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: fade, ease: "power3.out" },
        b.start,
      );
      tl.fromTo(
        b.screen,
        { opacity: 0, x: 28 },
        { opacity: 1, x: 0, duration: fade, ease: "power3.out" },
        b.start,
      );
      setActiveTab(b.tab, b.start);
      if (i < beats.length - 1) {
        tl.to(b.callout, { opacity: 0, y: -12, duration: fade, ease: "power2.in" }, end - fade);
        tl.to(b.screen, { opacity: 0, x: -20, duration: fade, ease: "power2.in" }, end - fade);
      }
    });

    tl.to("#tour-kicker", { color: "#f0b27a", duration: 0.25 }, 10.3);
    tl.to("#tour-content", { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" }, 13.55);

    window.__timelines["phone-tour"] = tl;
  </script>
